name: "Gosec Security Checker"
description: "Runs the gosec security checker"
author: "@ccojocar"

inputs:
  args:
    description: "Arguments for gosec"
    required: true
    default: "-h"

runs:
  using: "docker"
  image: "docker://ghcr.io/securego/gosec:sha256-7bcf1edbab3e80d8006a28d53e7031a9c9775be8eec30679e4adc1f51d272121" # 2.30.0
  args:
    - ${{ inputs.args }}

branding:
  icon: "shield"
  color: "blue"
